version: '3.8'

services:
  discovery-service:
    image: discovery-service
    container_name: discovery-service
    build:
      context: ./discovery-service
    ports:
      - "8761:8761"
    networks:
      - bank-network

  gateway-service:
    image: gateway-service
    container_name: gateway-service
    build:
      context: ./gateway-service
    ports:
      - "8888:8888"
    environment:
      - DISCOVERY_SERVICE=http://discovery-service:8761/eureka/
      - ALLOWED_ORIGINS=http://localhost:4200
    depends_on:
      - discovery-service
    networks:
      - bank-network

  notification-service:
    image: notification-service
    container_name: notification-service
    build:
      context: ./notification-service
    ports:
      - "8885:8885"
    environment:
      - DISCOVERY_SERVICE=http://discovery-service:8761/eureka/
      - MAIL_HOST=172.18.0.4
      - MAIL_PORT=1025
      - MAIL_USERNAME=brody
      - MAIL_PASSWORD=brody
      - EMAIL_SYSTEM=notification@bank.com
    depends_on:
      - discovery-service
      - gateway-service
    networks:
      - bank-network

  user-service:
    image: user-service
    container_name: user-service
    build:
      context: ./user-service
    ports:
      - "8884:8884"
    environment:
      - DISCOVERY_SERVICE=http://discovery-service:8761/eureka/
      - MYSQL_USER=root
      - MYSQL_PWD=root
      - MYSQL_HOST=172.18.0.2
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=utilisateur
      - JWT_SECRET=AaZzBbCcYyDdXxEeWwFf
      - JWT_EXPIRATION=604800000
    depends_on:
      - discovery-service
      - gateway-service
      - notification-service
    networks:
      - bank-network

  customer-service:
    image: customer-service
    container_name: customer-service
    build:
      context: ./customer-service
    ports:
      - "8887:8887"
    environment:
      - DISCOVERY_SERVICE=http://discovery-service:8761/eureka/
      - MYSQL_USER=root
      - MYSQL_PWD=root
      - MYSQL_HOST=172.18.0.2
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=customer_db
      - JWT_SECRET=AaZzBbCcYyDdXxEeWwFf
      - JWT_EXPIRATION=604800000
    depends_on:
      - discovery-service
      - gateway-service
      - notification-service
    networks:
      - bank-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bank-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - bank-network

  account-service:
    image: account-service
    container_name: account-service
    build:
      context: ./account-service
    ports:
      - "8886:8886"
    environment:
      - DISCOVERY_SERVICE=http://discovery-service:8761/eureka/
      - MYSQL_USER=root
      - MYSQL_PWD=root
      - MYSQL_HOST=172.18.0.2
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=account_db
      - AXON_HOST=172.18.0.3
      - AXON_PORT=8124
      - AXON_CONSOLE=df10b708-0:6p47cea5j2ff4ae0a17p227163886825
      - JWT_SECRET=AaZzBbCcYyDdXxEeWwFf
      - JWT_EXPIRATION=604800000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - discovery-service
      - gateway-service
      - customer-service
      - kafka
    networks:
      - bank-network

networks:
  bank-network:
    external: true