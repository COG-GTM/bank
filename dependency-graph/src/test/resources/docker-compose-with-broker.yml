version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root

  app-service:
    image: app-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/appdb
      - SPRING_RABBITMQ_HOST=amqp://rabbitmq
    depends_on:
      - rabbitmq
      - mysql-db
