server:
  port: 8888
spring:
  application:
    name: GATEWAY-SERVICE
  cloud:
    discovery:
      enabled: true
    gateway:
      routes:
        - id: customer-route
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/bank/customers/**
        - id: account-route
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/bank/accounts/**
            - Method=GET,POST
        - id: notification-route
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/bank/notifications/**
        - id: auth-route
          uri: http://auth-service:8885
          predicates:
            - Path=/bank/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
