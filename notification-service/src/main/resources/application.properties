server.port=8887
server.servlet.context-path=/bank

spring.application.name=NOTIFICATION-SERVICE

eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE:http://localhost:8761/eureka}

#MAIL CONFIG
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:brody}
spring.mail.password=${MAIL_PASSWORD:brody}
spring.mail.properties.mail.smtp.trust="*
spring.mail.properties.mail.auth=true
spring.mail.properties.mail.starttls.enabled=true
spring.mail.properties.mail.connectiontimeout=5000
spring.mail.properties.mail.timeout=3000
spring.mail.properties.mail.writetimeout=5000

application.mail.email-system=${EMAIL_SYSTEM:notification@bank.com}

#RABBITMQ CONFIG
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.concurrency=${NOTIFICATIONS_WORKER_CONCURRENCY:2}
spring.rabbitmq.listener.simple.max-concurrency=${NOTIFICATIONS_WORKER_MAX_CONCURRENCY:5}

application.notifications.exchange=${NOTIFICATIONS_EXCHANGE:notifications.exchange}
application.notifications.queue=${NOTIFICATIONS_QUEUE:notifications.queue}
application.notifications.routing-key=${NOTIFICATIONS_ROUTING_KEY:notifications.send}
application.notifications.dead-letter-queue=${NOTIFICATIONS_DLQ:notifications.queue.dlq}

management.endpoints.web.exposure.include=*