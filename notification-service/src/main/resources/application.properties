server.port=8887
server.servlet.context-path=/bank

spring.application.name=NOTIFICATION-SERVICE

eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE:http://localhost:8761/eureka}

#MAIL CONFIG
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:brody}
spring.mail.password=${MAIL_PASSWORD:brody}
spring.mail.properties.mail.smtp.trust="*
spring.mail.properties.mail.auth=true
spring.mail.properties.mail.starttls.enabled=true
spring.mail.properties.mail.connectiontimeout=5000
spring.mail.properties.mail.timeout=3000
spring.mail.properties.mail.writetimeout=5000

application.mail.email-system=${EMAIL_SYSTEM:notification@bank.com}

# H2 in-memory database for event projections (account-customer mapping)
spring.datasource.url=jdbc:h2:mem:notificationdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Axon Server configuration
axon.axonserver.enabled=${AXON_SERVER_ENABLED:false}

management.endpoints.web.exposure.include=*